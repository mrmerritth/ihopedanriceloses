<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Hope Dan Rice Loses</title>
  <script>
    // Set the theme before first paint so light-mode users don't see a dark flash.
    try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark"; } catch { document.documentElement.dataset.theme = "dark"; }
  </script>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <button id="theme-toggle" type="button" aria-label="Toggle light and dark mode"></button>
    <h1>I Hope Dan Rice Loses</h1>
    <p id="subtitle">Weekly Sleeper matchup tracker</p>
  </header>

  <main id="app">
    <p class="status">Loading…</p>
  </main>

  <footer id="footer"></footer>
</body>
</html>
